[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triffid-ugv-perception"
version = "0.1.0"
description = "Live UGV perception: detection, 1 Hz tracking and geolocation of objects from ROS 2 topics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8", "pillow>=10", "pyyaml>=6", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
triffid-ugv = "triffid_ugv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
